name: Dev Lua Check and PR

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  lua-check:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate Lua syntax
        run: |
          set -e
          files=$(find -name '*.lua')
          if [ -z "$files" ]; then
            echo "No Lua files found under src/. Skipping syntax check."
            exit 0
          fi
          echo "$files" | while read -r file; do
            echo "Checking $file"
            luac5.4 -p "$file"
          done

  create-pr:
    name: Open PR to main
    runs-on: ubuntu-latest
    needs: lua-check
    steps:
      - name: Create or reuse PR
        uses: actions/github-script@v7
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = 'dev';
            const base = process.env.DEFAULT_BRANCH || 'main';

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });

            if (prs.length > 0) {
              core.info(`Open PR already exists: ${prs[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: 'Sync dev to main',
              body: 'Automated PR created after successful Lua syntax validation on dev.',
            });

            core.info(`Created PR: ${pr.html_url}`);
